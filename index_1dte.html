<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0d1117"/>
<title>SPY 1DTE IV</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{--bg:#0d1117;--hud:#111827;--line:#1f2937;--text:#d1d4dc;--muted:#8b949e;--iv:#00bcd4}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:13px/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
  #top{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:8px 10px;background:var(--hud);border-bottom:1px solid var(--line)}
  #sym{font-weight:700;font-size:15px} #meta{color:var(--muted);font-size:11px}
  #hud{display:flex;flex-wrap:wrap;gap:8px 12px;padding:6px 10px;border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums}
  #hud span{color:var(--muted)} #hud b{color:#fff;font-weight:600}
  #chips{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line)}
  .chip{border:1px solid #30363d;background:#161b22;color:var(--text);border-radius:6px;padding:4px 10px;font-size:12px}
  .chip.active{border-color:var(--iv);color:#fff}
  #chart{height:calc(100vh - 110px);width:100%}
</style>
</head>
<body>
  <div id="top"><div><div id="sym">SPY 1DTE IV</div><div id="meta">loading…</div></div><div id="live">●</div></div>
  <div id="hud">
    <span>O <b id="o">—</b></span><span>H <b id="h">—</b></span>
    <span>L <b id="l">—</b></span><span>C <b id="c">—</b></span>
    <span>Spot <b id="spot">—</b></span>
  </div>
  <div id="chips">
    <button class="chip" data-bars="39">1D</button>
    <button class="chip active" data-bars="78">2D</button>
    <button class="chip" data-bars="195">5D</button>
    <button class="chip" data-bars="9999">All</button>
  </div>
  <div id="chart"></div>
<script>
const BARS_URL="SPY_1dte_bars.json";
const opts={layout:{background:{color:"#0d1117"},textColor:"#d1d4dc"},
  grid:{vertLines:{color:"#1f242c"},horzLines:{color:"#1f242c"}},
  crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
  rightPriceScale:{borderVisible:false},
  timeScale:{borderVisible:false,timeVisible:true,secondsVisible:false},
  handleScroll:{vertTouchDrag:false}};
const chart=LightweightCharts.createChart(document.getElementById("chart"), opts);
const ivBars=chart.addCandlestickSeries({
  upColor:"#26a69a", downColor:"#ef5350",
  borderUpColor:"#26a69a", borderDownColor:"#ef5350",
  wickUpColor:"#26a69a", wickDownColor:"#ef5350",
  title:"IV %"
});
const ivLine=chart.addLineSeries({color:"#00BFFF", lineWidth:2, priceLineVisible:false, lastValueVisible:true});
let ivData=[], visibleBars=78;
function setRange(){
  const n=ivData.length; if(!n)return;
  chart.timeScale().setVisibleLogicalRange({from:Math.max(0,n-visibleBars), to:n});
}
function paintHud(bar){
  if(!bar)return;
  o.textContent=bar.open.toFixed(2);
  h.textContent=bar.high.toFixed(2);
  l.textContent=bar.low.toFixed(2);
  c.textContent=bar.close.toFixed(2);
  c.style.color=bar.close>=bar.open?"#26a69a":"#ef5350";
}
chart.subscribeCrosshairMove(p=>{
  const bar=p.seriesData?.get(ivBars);
  if(bar) paintHud(bar);
});
document.querySelectorAll(".chip").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".chip").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active"); visibleBars=+btn.dataset.bars; setRange();
}));
async function load(){
  try{
    const res=await fetch(BARS_URL+(BARS_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const data=await res.json();
    ivData=data.iv||[];
    ivBars.setData(ivData);
    ivLine.setData(ivData.map(b=>({time:b.time, value:b.close})));
    const exp=data.expiration?` · exp ${data.expiration}`:"";
    sym.textContent=`${data.ticker||"SPY"} · ${data.book||""} IV · 10m${exp}`;
    meta.textContent="updated "+(data.updated||"").replace("T"," ").slice(0,19);
    spot.textContent=data.spot!=null?Number(data.spot).toFixed(2):"—";
    live.style.color=ivData.length?"#26a69a":"#f59e0b";
    if(ivData.length) paintHud(ivData.at(-1));
    else meta.textContent="no IV bars yet — waiting for next-expiry samples";
    setRange();
  }catch(e){
    live.style.color="#ef5350";
    meta.textContent="refresh failed — "+BARS_URL;
  }
}
new ResizeObserver(()=>{
  chart.applyOptions({width:chart.clientWidth||document.getElementById("chart").clientWidth,
                      height:document.getElementById("chart").clientHeight});
}).observe(document.body);
load(); setInterval(load, 30000);
</script>
</body>
</html>
