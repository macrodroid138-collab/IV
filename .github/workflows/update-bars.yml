name: Update IV bars

on:
  workflow_dispatch:
  schedule:
    # Every 5 minutes, every day (GitHub cannot do 2-minute cron).
    # 0DTE append is gated in Python (RTH only).
    # Next-expiry appends on every run, including nights/weekends.
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pandas yfinance

      - name: Run updater
        run: python update_bars.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SPY_0dte_bars.json SPY_1dte_bars.json
          if [ -f SPY_0dte_iv_ticks.csv ]; then git add SPY_0dte_iv_ticks.csv; fi
          if [ -f SPY_1dte_iv_ticks.csv ]; then git add SPY_1dte_iv_ticks.csv; fi
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update SPY IV bars $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
